<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SVG를 먼저 두면 지원하는 브라우저는 이쪽을 쓴다. 확대해도 뭉개지지 않는다.
         ico는 SVG 파비콘을 모르는 구형 브라우저(Safari 16.3 이하 등)를 위한 대비책이다. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#0284c7">

    <!-- 라우터가 화면마다 제목을 바꿔주지만 그건 JS가 실행된 뒤다.
         첫 로딩 순간과 북마크·링크 미리보기에는 이 값이 쓰인다. -->
    <title>지역별 날씨 대시보드 · 판교_5반_임채환</title>
    <meta
      name="description"
      content="전국 주요 도시의 실시간 날씨를 보여주는 대시보드. SKALA Vue.js 실습 과제 — 판교 5반 임채환."
    >
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
