<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="날씨 대시보드">
  <!-- 헤더의 ☁ 마크와 히어로의 하늘 그라데이션을 그대로 옮겼다.
       16px에서도 뭉개지지 않도록 형태는 원과 둥근 사각형만 쓴다. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)" />
  <g fill="#ffffff">
    <circle cx="23" cy="38" r="9" />
    <circle cx="34" cy="29" r="12" />
    <circle cx="45" cy="38" r="9" />
    <rect x="23" y="38" width="22" height="9" rx="4.5" />
  </g>
</svg>
